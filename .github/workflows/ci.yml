name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint package and test suite
        run: python -m ruff check oss_audit tests

      - name: Run unit and subprocess integration tests
        run: python -m pytest -q

      - name: Replay historical counterexample verification suite
        run: python -m oss_audit verify --suite historical-counterexamples

      - name: Verify candidate falsification and lifecycle fixture suite
        run: python -m oss_audit verify --suite candidate-falsification

      - name: Verify pinned contribution policy routing samples
        run: python -m oss_audit policy --check-samples
